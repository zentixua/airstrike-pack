# Сборка «Airstrike Pack» (pack/, packwiz): индекс свежий, файлы для лаунчера собираются — .mrpack и экземпляр Prism,
# который ставит сборку с main сам при каждом запуске (tools/prism_instance.py); оба — в артефактах запуска.
# Новая version в pack.toml на main выходит сама: релиз v<version> с этими файлами под постоянными именами, их
# последняя версия скачивается без входа по releases/latest/download/<имя>.
name: build

# Каждый коммит проверяется один раз: ветки — запуском pull_request (он и решает слияние), main — push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# новый пуш в ветку PR отменяет прежнюю проверку; запуск на main не отменяется — в нём может идти релиз
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pack:
    name: Сборка модов
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: pack
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260906154125-ef87d964f8cb

      # .pw.toml правят руками или packwiz; индекс с их хешами должен быть пересчитан тем же коммитом
      - name: Индекс свежий
        run: |
          packwiz refresh
          git diff --exit-code -- .

      - name: Версия сборки
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pack.toml)" >> "$GITHUB_OUTPUT"

      # имена без версии: у релиза releases/latest/download/<имя> всегда ведёт к последней сборке
      - name: Файл для лаунчера
        run: packwiz mr export -o airstrike-pack.mrpack

      - name: Экземпляр Prism с автообновлением
        run: python3 ../tools/prism_instance.py airstrike-pack-prism.zip

      - uses: actions/upload-artifact@v6
        with:
          name: airstrike-pack
          path: |
            pack/airstrike-pack.mrpack
            pack/airstrike-pack-prism.zip
          if-no-files-found: error

  release:
    name: Релиз
    needs: pack
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Есть ли уже
        id: exists
        run: |
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "Релиз v$V уже есть — сборка этой версии вышла раньше" >> "$GITHUB_STEP_SUMMARY"
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        if: steps.exists.outputs.yes != 'true'
        with:
          name: airstrike-pack
          path: dist

      - name: Релиз
        if: steps.exists.outputs.yes != 'true'
        run: |
          # строка версии из таблицы «Версии» README.md: | версия | Airstrike | что изменилось |
          row=$(awk -F ' [|] ' -v v="$V" '$1 == "| " v { print $2 "\t" substr($3, 1, length($3) - 2) }' README.md)
          [ -n "$row" ] || { echo "README.md: нет строки версии $V в «Версии»"; exit 1; }
          airstrike=${row%%$'\t'*}
          changes=${row#*$'\t'}
          mc=$(sed -n 's/^minecraft = "\(.*\)"$/\1/p' pack/pack.toml)
          neoforge=$(sed -n 's/^neoforge = "\(.*\)"$/\1/p' pack/pack.toml)
          cat > notes.md <<EOF
          Minecraft $mc, NeoForge $neoforge, Airstrike $airstrike. $changes

          ## Установка
          - \`airstrike-pack-prism.zip\` — экземпляр [Prism Launcher](https://prismlauncher.org/download/), который сам обновляет сборку перед каждым запуском игры: «Добавить экземпляр…» → «Импорт» → этот файл.
          - \`airstrike-pack.mrpack\` — разовая установка этой версии без автообновления: импорт в Prism Launcher или Modrinth App.

          Подробно — [README](https://github.com/zentixua/airstrike-pack#установка).
          EOF
          gh release create "v$V" dist/airstrike-pack-prism.zip dist/airstrike-pack.mrpack --target "$GITHUB_SHA" \
            --title "Airstrike Pack $V" --notes-file notes.md --latest
