# Сборка «Airstrike Pack» (pack/, packwiz): индекс свежий, файлы для лаунчера собираются — .mrpack и экземпляр Prism,
# который ставит сборку с main сам при каждом запуске (tools/prism_instance.py); оба — в артефактах запуска.
# Новая version в pack.toml на main выходит сама: релиз v<version> с этими файлами под постоянными именами, их
# последняя версия скачивается без входа по releases/latest/download/<имя>.
name: build

# Каждый коммит проверяется один раз: ветки — запуском pull_request (он и решает слияние), main — push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# новый пуш в ветку PR отменяет прежнюю проверку; запуск на main не отменяется — в нём может идти релиз
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pack:
    name: Сборка модов
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: pack
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260906154125-ef87d964f8cb

      # .pw.toml правят руками или packwiz; индекс с их хешами должен быть пересчитан тем же коммитом
      - name: Индекс свежий
        run: |
          packwiz refresh
          git diff --exit-code -- .

      - name: Версия сборки
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' pack.toml)
          [ -n "$v" ] || { echo "pack.toml: нет version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # имена без версии: у релиза releases/latest/download/<имя> всегда ведёт к последней сборке; Prism называет
      # экземпляр по имени файла (пробел в имени файла выпуска GitHub заменил бы точкой)
      - name: Файл для лаунчера
        run: packwiz mr export -o Airstrike-Pack.mrpack

      - name: Экземпляр Prism с автообновлением
        run: python3 ../tools/prism_instance.py Airstrike-Pack.zip

      # заметки релиза — и на PR: новая версия без строки в «Версиях» README.md не дойдёт до main
      - name: Заметки релиза
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # строка версии из таблицы «Версии» README.md: | версия | Airstrike | что изменилось |
          row=$(awk -F ' [|] ' -v v="$V" '$1 == "| " v { print $2 "\t" substr($3, 1, length($3) - 2) }' ../README.md)
          [ -n "$row" ] || { echo "README.md: нет строки версии $V в «Версиях»"; exit 1; }
          airstrike=${row%%$'\t'*}
          changes=${row#*$'\t'}
          changes=${changes//](#/](https://github.com/zentixua/airstrike-pack#}  # якоря README — в заметках полной ссылкой
          mc=$(sed -n 's/^minecraft = "\(.*\)"$/\1/p' pack.toml)
          neoforge=$(sed -n 's/^neoforge = "\(.*\)"$/\1/p' pack.toml)
          cat > release-notes.md <<EOF
          Minecraft $mc, NeoForge $neoforge, Airstrike $airstrike. $changes

          ## Установка
          - \`Airstrike-Pack.zip\` — экземпляр [Prism Launcher](https://prismlauncher.org/download/), который сам обновляет сборку перед каждым запуском игры: «Добавить экземпляр…» → «Импорт» → этот файл.
          - \`Airstrike-Pack.mrpack\` — разовая установка этой версии без автообновления: импорт в Prism Launcher или Modrinth App.

          Подробно — [README](https://github.com/zentixua/airstrike-pack#установка).
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: airstrike-pack
          path: |
            pack/Airstrike-Pack.mrpack
            pack/Airstrike-Pack.zip
            pack/release-notes.md
          if-no-files-found: error

  release:
    name: Релиз
    needs: pack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      V: ${{ needs.pack.outputs.version }}
    steps:
      - name: Есть ли уже
        id: exists
        run: |
          case $(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null) in
            false)
              echo "Релиз v$V уже есть — сборка этой версии вышла раньше" >> "$GITHUB_STEP_SUMMARY"
              echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            # черновик остаётся от запуска, прерванного на загрузке файлов (gh выпускает через черновик): заново
            true) gh release delete "v$V" --yes ;;
          esac

      - uses: actions/download-artifact@v7
        if: steps.exists.outputs.yes != 'true'
        with:
          name: airstrike-pack
          path: dist

      - name: Релиз
        if: steps.exists.outputs.yes != 'true'
        run: |
          gh release create "v$V" dist/Airstrike-Pack.zip dist/Airstrike-Pack.mrpack --target "$GITHUB_SHA" \
            --title "Airstrike Pack $V" --notes-file dist/release-notes.md --latest
